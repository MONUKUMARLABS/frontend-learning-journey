<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 950px;
            margin: 40px auto;
            padding: 20px;
        }

        form,
        .controls {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .controls {
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
        }

        input,
        select,
        button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }

        .dashboard-card {
            background: #eff6ff;
            border-radius: 8px;
            padding: 15px;
        }

        .dashboard-card p {
            margin: 0 0 8px;
        }

        .student-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .delete-button {
            background: #dc2626;
            color: white;
            border: none;
        }

        #error {
            color: red;
        }

        #success {
            color: green;
        }
    </style>
</head>

<body>

    <h1>Student Management</h1>

    <form id="studentForm" novalidate>
        <input id="name" type="text"
            placeholder="Student Name">

        <input id="email" type="email"
            placeholder="Email">

        <input id="marks" type="number"
            placeholder="Marks (0 to 100)">

        <button id="submitButton" type="submit">
            Add Student
        </button>
    </form>

    <p id="error"></p>
    <p id="success"></p>

    <div class="controls">
        <div>
            <label for="search">Search</label>
            <input id="search" type="text"
                placeholder="Search name or email">
        </div>

        <div>
            <label for="filter">Filter</label>
            <select id="filter">
                <option value="all">All</option>
                <option value="passed">Passed</option>
                <option value="failed">Failed</option>
            </select>
        </div>

        <div>
            <label for="sort">Sort</label>
            <select id="sort">
                <option value="marks-desc">
                    Marks High → Low
                </option>
                <option value="marks-asc">
                    Marks Low → High
                </option>
                <option value="name-asc">
                    Name A → Z
                </option>
                <option value="name-desc">
                    Name Z → A
                </option>
            </select>
        </div>
    </div>

    <h2>Dashboard</h2>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <p>Total Students</p>
            <strong id="totalStudents">0</strong>
        </div>

        <div class="dashboard-card">
            <p>Passed Students</p>
            <strong id="passedStudents">0</strong>
        </div>

        <div class="dashboard-card">
            <p>Failed Students</p>
            <strong id="failedStudents">0</strong>
        </div>

        <div class="dashboard-card">
            <p>Average Marks</p>
            <strong id="averageMarks">0.00</strong>
        </div>

        <div class="dashboard-card">
            <p>Highest Marks</p>
            <strong id="highestMarks">-</strong>
        </div>

        <div class="dashboard-card">
            <p>Lowest Marks</p>
            <strong id="lowestMarks">-</strong>
        </div>

        <div class="dashboard-card">
            <p>Top Student</p>
            <strong id="topStudent">-</strong>
        </div>
    </div>

    <h2>🏆 Top 3 Students</h2>
    <ol id="topThreeList"></ol>

    <h2>Student Cards</h2>
    <div id="studentsContainer"></div>

    <script src="script.js"></script>

</body>

</html>
