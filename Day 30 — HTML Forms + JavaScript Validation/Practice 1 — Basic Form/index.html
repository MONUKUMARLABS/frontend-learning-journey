<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

</head>

<body>

    <h1>Registration</h1>

    <form id="registerForm">

        <label>Name</label>

        <input
            id="name"
            type="text">

        <br><br>

        <label>Email</label>

        <input
            id="email"
            type="email">

        <br><br>

        <label>Password</label>

        <input
            id="password"
            type="password">

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <p id="error"></p>

    <p id="success"></p>

</body>

</html>
