<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
        }

        #search {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .student-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        #error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Student Viewer</h1>

    <div class="controls">
        <button id="loadButton">
            Load Students
        </button>

        <button id="refreshButton">
            Refresh
        </button>
    </div>

    <input
        id="search"
        type="text"
        placeholder="Search users by name or email">

    <p id="error"></p>

    <div id="usersContainer"></div>

    <script src="script.js"></script>

</body>

</html>
