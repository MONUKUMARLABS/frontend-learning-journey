<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        form {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .stat-card {
            background-color: #eff6ff;
            border-radius: 8px;
            padding: 15px;
        }

        .stat-card p {
            margin: 0 0 8px;
        }

        .student-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            border: none;
        }

        #error {
            color: red;
        }

        #success {
            color: green;
        }
    </style>
</head>

<body>

    <h1>Student Management Dashboard</h1>

    <form id="studentForm" novalidate>

        <input id="name" type="text"
            placeholder="Student Name">

        <input id="email" type="email"
            placeholder="Email">

        <input id="marks" type="number"
            placeholder="Marks (0 to 100)">

        <button id="submitButton" type="submit">
            Add Student
        </button>

    </form>

    <p id="error"></p>
    <p id="success"></p>

    <h2>Student Dashboard</h2>

    <div class="dashboard-grid">
        <div class="stat-card">
            <p>Total Students</p>
            <strong id="totalStudents">0</strong>
        </div>

        <div class="stat-card">
            <p>Passed Students</p>
            <strong id="passedStudents">0</strong>
        </div>

        <div class="stat-card">
            <p>Failed Students</p>
            <strong id="failedStudents">0</strong>
        </div>

        <div class="stat-card">
            <p>Average Marks</p>
            <strong id="averageMarks">0.00</strong>
        </div>

        <div class="stat-card">
            <p>Highest Marks</p>
            <strong id="highestMarks">-</strong>
        </div>

        <div class="stat-card">
            <p>Lowest Marks</p>
            <strong id="lowestMarks">-</strong>
        </div>

        <div class="stat-card">
            <p>Top Student</p>
            <strong id="topStudent">-</strong>
        </div>
    </div>

    <h2>Top 3 Students</h2>
    <ol id="topThreeList"></ol>

    <h2>Students</h2>

    <input id="search" type="text"
        placeholder="Search student by name">

    <br><br>

    <div id="studentsContainer"></div>

    <script src="script.js"></script>

</body>

</html>
