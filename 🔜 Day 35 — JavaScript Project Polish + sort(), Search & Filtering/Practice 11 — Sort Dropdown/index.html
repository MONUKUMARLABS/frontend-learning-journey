<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Numeric Sort</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 20px;
            }
            select {
                padding: 10px;
                font-size: 16px;
            }
            .numbers {
                margin-top: 20px;
                font-size: 18px;
            }
        </style>
    </head>

    <body>
<select id="sortSelect">

    <option value="default">
        Default
    </option>

    <option value="high">
        Marks: High to Low
    </option>

    <option value="low">
        Marks: Low to High
    </option>

    <option value="az">
        Name: A to Z
    </option>

    <option value="za">
        Name: Z to A
    </option>

</select>
    </body>
</html>
