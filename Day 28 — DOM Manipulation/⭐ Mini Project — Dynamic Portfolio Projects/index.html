<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="portfolio">
    <header class="hero">
      <p class="eyebrow">Developer Showcase</p>
      <h1>My Portfolio</h1>
      <p class="intro">
        A selection of technologies I use and projects I have built.
      </p>
    </header>

    <section>
      <div class="section-heading">
        <p class="section-number">01</p>
        <h2>Skills</h2>
      </div>

      <ul class="skills-list" id="skills"></ul>
    </section>

    <section>
      <div class="section-heading">
        <p class="section-number">02</p>
        <h2>Projects</h2>
      </div>

      <div class="projects-grid" id="projects"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
